# Activated with:  mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=mysql
# or by setting the environment variable SPRING_PROFILES_ACTIVE=mysql (used when deployed).
#
# Locally the database "learnhub_db" is created automatically if it doesn't exist.
# For a cloud database, set DB_URL, e.g.
#   jdbc:mysql://<host>:<port>/defaultdb?sslMode=REQUIRED
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/learnhub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.h2.console.enabled=false

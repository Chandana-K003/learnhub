# Hosting platforms (e.g. Render) provide the port in the PORT environment variable.
server.port=${PORT:8080}
spring.application.name=learnhub

# ------------------------------------------------------------------
# DEFAULT DATABASE: embedded H2 running in MySQL compatibility mode.
# No MySQL installation needed. Data is stored in ./data/learnhub.*
# To use a real MySQL server, run with the "mysql" profile
# (see application-mysql.properties and README.md).
# ------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/learnhub;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT
# In production set JWT_SECRET (at least 32 characters).
app.jwt.secret=${JWT_SECRET:learnhub-super-secret-key-change-me-0123456789abcdef}
app.jwt.expiration-ms=86400000
